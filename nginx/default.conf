server {
    listen 80;
    server_name _;

    # Max upload size (for future upload support)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy
    # Use Docker's internal DNS resolver so upstream IP is re-resolved on
    # each request instead of being cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8001;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long ML operations
        proxy_read_timeout 120s;

        # Retry on connect failure so the frontend stays up while backend is still starting
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Internal location for X-Accel-Redirect — serves original photos/videos
    # directly from disk after the backend has authenticated the request.
    # The `internal` directive blocks direct client access.
    location /protected-photos/ {
        internal;
        alias /mnt/photos/;
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
        # nginx handles Accept-Ranges / byte-range requests natively,
        # enabling video seeking without streaming through Python.
        add_header Accept-Ranges bytes;
    }

    # Serve thumbnails directly from cache (bypass Python)
    location /thumbnails/ {
        alias /data/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # Only serve image files
        location ~* \.(jpg|jpeg|png|webp)$ {
            try_files $uri =404;
        }

        # Block non-image requests
        return 403;
    }
}
