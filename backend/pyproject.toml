[project]
name = "photosapp-backend"
version = "0.1.0"
description = "Self-hosted photo management backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.14.0",

    # Auth
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Image processing
    "Pillow>=11.0.0",
    "pillow-heif>=0.18.0",

    # Face detection & recognition
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",

    # Vector storage
    "pgvector>=0.3.0",

    # EXIF & metadata
    "exifread>=3.0.0",

    # Geocoding
    "geopy>=2.4.0",

    # File watching
    "watchdog>=6.0.0",

    # Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
all = ["photosapp-backend[dev]"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S104"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
